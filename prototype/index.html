<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>henyoOS · Wellness &amp; Spa — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F8FC;--surface:#FFFFFF;--line:#E3E8F0;--line2:#EDF1F6;--text:#0B1220;--muted:#5A6478;--soft:#EEF2F7;
  --accent:#7C3AED;--accent-ink:#FFFFFF;--accent-soft:#EFE6FB;--accent-text:#5B21B6;--accent-line:#C9AEF5;
  --conf-bg:#E2F3EA;--conf-fg:#154530;--in-bg:#FCEFD0;--in-fg:#4A3505;--closed-bg:#E1EBFB;--closed-fg:#17345E;
  --att-bg:#FBE2DE;--att-fg:#6E1F15;--off:#EEF1F5;--booked-line:#A9B3C1;--danger:#C2412D;
  --shadow:0 12px 32px rgba(11,18,32,.10);--scrim:rgba(11,18,32,.38);
}
[data-theme="dark"]{
  --bg:#0D0B14;--surface:#17141F;--line:#2A2536;--line2:#221E2C;--text:#F2EFF8;--muted:#A7A1B5;--soft:#221E2C;
  --accent:#B794F6;--accent-ink:#1A0B33;--accent-soft:#2A2140;--accent-text:#D6C2FB;--accent-line:#4A3A6E;
  --conf-bg:#153226;--conf-fg:#BFE5D2;--in-bg:#3A2E12;--in-fg:#F5E2B2;--closed-bg:#1A2A44;--closed-fg:#C8D9F2;
  --att-bg:#3D1C18;--att-fg:#F6C9C1;--off:#1E1A27;--booked-line:#5D5670;--danger:#F08A7A;
  --shadow:0 12px 32px rgba(0,0,0,.45);--scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:var(--accent-text)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1}
h1{margin:0;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.02em}
.cap{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.btn{border:none;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.btn.lg{font-size:16px;padding:16px 20px}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.soft{background:var(--accent-soft);color:var(--accent-text)}
.btn.link{background:none;color:var(--accent-text);padding:6px 4px;font-weight:600}
.btn.sm{padding:8px 14px;font-size:13px}
.icon-btn{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.st-booked{background:var(--surface);color:var(--text);border:1px solid var(--booked-line)}
.st-confirmed{background:var(--conf-bg);color:var(--conf-fg)}
.st-checkedin{background:var(--in-bg);color:var(--in-fg)}
.st-closed{background:var(--closed-bg);color:var(--closed-fg)}
.st-attention{background:var(--att-bg);color:var(--att-fg)}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:none;background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:700}
.banner{background:#0B1220;color:#fff;font-size:12px;padding:7px 16px;display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap}
[data-theme="dark"] .banner{background:#2A2140}
.banner button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2346E8,#7C2BE0);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
/* staff shell */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.nav a{color:var(--text);text-decoration:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.nav a.on{background:var(--accent-soft);color:var(--accent-text)}
.nav a.dim{color:var(--muted)}
.search{position:relative;flex:1;max-width:420px;min-width:200px}
.search label{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.search input{border:none;background:transparent;outline:none;flex:1;min-width:0;font-size:13px}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:40}
.dropdown button,.menu button{display:flex;width:100%;text-align:left;border:none;background:transparent;border-radius:10px;padding:9px 12px;font-size:13px;gap:8px;align-items:center;justify-content:space-between}
.dropdown button:hover,.menu button:hover{background:var(--soft)}
.menu{position:absolute;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:230px}
main.page{padding:22px 24px 32px;display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto;width:100%}
/* book */
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bookwrap{overflow:auto;max-height:calc(100vh - 250px);min-height:420px}
.bookgrid{min-width:880px;position:relative}
.bookhead{display:grid;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:5}
.bookhead div{padding:10px;display:flex;flex-direction:column;border-left:1px solid var(--line2)}
.bookhead div:first-child{border-left:none}
.bookbody{display:grid;position:relative}
.timecol{position:relative}
.timecol span{position:absolute;right:10px;font-size:11px;color:var(--muted);transform:translateY(-1px)}
.col{position:relative;border-left:1px solid var(--line2);cursor:copy;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 79px,var(--line2) 79px,var(--line2) 80px)}
.off{position:absolute;left:0;right:0;background:var(--off);color:var(--muted);font-size:11px;padding:6px 8px;cursor:not-allowed}
.blk{position:absolute;left:4px;right:4px;border-radius:10px;padding:6px 9px;font-size:12px;line-height:16px;overflow:hidden;text-align:left;border:none;cursor:pointer}
.blk b{font-size:13px}
.blk .tag{border-radius:4px;padding:0 5px;font-size:10px;font-weight:700;margin-left:4px;background:currentColor}
.blk .tag span{color:var(--surface)}
.blk.flash{outline:3px solid var(--accent);outline-offset:1px}
.nowline{position:absolute;left:56px;right:0;border-top:2px dashed var(--text);z-index:1;pointer-events:none;opacity:.55}
.blk{z-index:2}
.nowtag{position:absolute;left:4px;background:var(--text);color:var(--bg);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;z-index:4}
/* side panel */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:60;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(11,18,32,.12);border-left:1px solid var(--line)}
.panel-h{padding:20px 22px 14px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel-b{flex:1;overflow:auto;padding:16px 22px;display:flex;flex-direction:column;gap:18px}
.panel-f{padding:14px 22px 20px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.modal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(480px,calc(100% - 32px));background:var(--surface);border-radius:20px;box-shadow:0 24px 60px rgba(11,18,32,.25);padding:24px;z-index:70;display:flex;flex-direction:column;gap:16px}
.note{border-radius:12px;padding:10px 12px;font-size:13px;line-height:19px}
.note.ok{background:var(--conf-bg);color:var(--conf-fg)}
.note.warn{background:var(--in-bg);color:var(--in-fg)}
.note.bad{background:var(--att-bg);color:var(--att-fg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:12px 14px}
td{padding:12px 14px;border-top:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,430px);gap:20px;align-items:start}
.stats{display:flex;gap:28px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.stats b{font-size:18px;color:var(--text);display:block}
.opt{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);cursor:pointer;width:100%;text-align:left}
.opt.on{border:2px solid var(--accent);padding:11px 13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-weight:600;font-size:13px}
.tbtn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text);font-weight:700}
.big{font-size:44px;line-height:50px;font-weight:800;letter-spacing:-.03em}
.msg-me{align-self:flex-end;max-width:85%;background:var(--text);color:var(--bg);border-radius:16px 16px 4px 16px;padding:10px 14px}
.msg-ai{max-width:94%;background:var(--bg);border-radius:16px 16px 16px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
/* chooser */
.chooser{max-width:1080px;margin:0 auto;padding:40px 24px;display:flex;flex-direction:column;gap:28px}
.choose-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.choose{display:flex;flex-direction:column;gap:10px;padding:24px;text-decoration:none;color:var(--text);overflow:hidden}
.choose:hover{border-color:var(--accent)}
.tilebar{height:4px;background:#8B2FD9;margin:-24px -24px 16px}
/* guest booking */
.gb{max-width:440px;margin:0 auto;min-height:calc(100vh - 34px);background:var(--surface);display:flex;flex-direction:column}
@media(min-width:600px){.gbwrap{padding:24px 0}.gb{min-height:800px;border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}}
.gb-h{padding:16px 20px 0;display:flex;flex-direction:column;gap:12px}
.gb-b{flex:1;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.gb-f{padding:14px 20px 20px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:10px;position:sticky;bottom:0;background:var(--surface)}
.bar{height:4px;background:var(--soft);border-radius:2px}
.bar i{display:block;height:4px;background:var(--accent);border-radius:2px}
.catlink{display:flex;justify-content:space-between;align-items:center;padding:16px 2px;border:none;border-bottom:1px solid var(--line2);background:none;width:100%;text-align:left}
.svc{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);text-align:left;width:100%}
.svc.on{border:2px solid var(--accent);padding:15px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0;font-size:11px;color:var(--muted)}
.day b{font-size:17px;color:var(--text)}
.day.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.day.on b{color:var(--bg)}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 0;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot small{font-size:11px;font-weight:700;color:var(--conf-fg)}
.slot.on small{color:var(--accent-ink)}
@media(max-width:900px){
  .two{grid-template-columns:1fr}
  .top{padding:10px 14px}.nav{padding:8px 14px}main.page{padding:16px 14px 28px}
  .hide-sm{display:none!important}
}
</style>
</head>
<body>

<script>
'use strict';
/* ---------- constants ---------- */
const DEMO_NOW = 12*60+40;            // demo clock 12:40
const OPEN = 10*60, CLOSE = 20*60, PXH = 80;
const DAY0 = new Date(2026,10,22);    // Sunday 22 Nov 2026
const COUNTRIES = {
  AE:{name:'UAE',cur:'AED',vat:.05,code:'+971',rate:1,step:1},
  PH:{name:'Philippines',cur:'PHP',vat:.12,code:'+63',rate:15,step:10},
  SA:{name:'Saudi Arabia',cur:'SAR',vat:.15,code:'+966',rate:1,step:1}
};
const PROVIDERS = [
  {id:'layla',name:'Layla',skill:'massage',g:'F',room:'Room 1'},
  {id:'omar',name:'Omar',skill:'massage',g:'M',room:'Room 2'},
  {id:'sara',name:'Sara',skill:'esthetics',g:'F',room:'Room 3'},
  {id:'dana',name:'Dana',skill:'esthetics',g:'F',room:'Room 4'},
  {id:'ali',name:'Ali',skill:'massage',g:'M',room:'Room 5'}
];
const OFF = { layla:[[780,840,'Break']], dana:[[600,720,'Starts 12:00']] };
const SERVICES = [
  {id:'swe',name:'Swedish massage',short:'Swedish',cat:'Massage',skill:'massage',desc:'Relaxing, light to medium pressure',p:{50:299,80:399},intro:249},
  {id:'deep',name:'Deep tissue massage',short:'Deep tissue',cat:'Massage',skill:'massage',desc:'Firm pressure for tight muscles',p:{50:329,80:429}},
  {id:'hot',name:'Hot stone massage',short:'Hot stone',cat:'Massage',skill:'massage',desc:'Heated basalt stones',p:{50:379,80:479}},
  {id:'aroma',name:'Aromatherapy massage',short:'Aromatherapy',cat:'Massage',skill:'massage',desc:'Essential oils, gentle pressure',p:{50:349,80:449}},
  {id:'classic',name:'Classic facial',short:'Classic facial',cat:'Facials',skill:'esthetics',desc:'Cleanse, exfoliate, hydrate',p:{50:279,80:379},intro:229},
  {id:'hydra',name:'Hydrating facial',short:'Hydrating facial',cat:'Facials',skill:'esthetics',desc:'Deep moisture for dry skin',p:{50:349,80:449}},
  {id:'peel',name:'Brightening peel',short:'Peel',cat:'Facials',skill:'esthetics',desc:'Gentle peel for glow',p:{50:299}},
  {id:'lip',name:'Lip wax',short:'Lip wax',cat:'Waxing',skill:'esthetics',desc:'Quick and precise',p:{15:49}}
];
const ADDONS = [{id:'oil',name:'Aromatherapy oil',p:40},{id:'scalp',name:'Hot towel scalp',p:30},{id:'eye',name:'Cooling eye mask',p:35}];
const PRODUCTS = [{id:'serum',name:'Hydrating serum 30 ml',p:120},{id:'bodyoil',name:'Calming body oil',p:95}];
const PLANS = [{id:'ess',name:'Essential',p:199,desc:'One 50 min service a month'},{id:'glow',name:'Monthly Glow',p:299,desc:'One 80 min service + member prices'},{id:'house',name:'Household',p:499,desc:'Two members, shared prices'}];
const SETUP_FEE = 150;
const STORE_KEY = 'henyo-wln-proto-v1';

/* ---------- state ---------- */
function seed(){
  const g = (id,first,last,phone,extra) => Object.assign({id,first,last,phone,email:'',visits:3,member:null,card:null,sms:true,ref:'Walk-in',lifetime:900,notes:''},extra||{});
  const guests = [
    g('g1','Maryam','Haddad','501234567',{member:'glow',card:{brand:'Visa',last4:'4417'},visits:12,lifetime:6240,ref:'Instagram',notes:'Prefers medium pressure, no nut oils.',email:'maryam.h@example.com'}),
    g('g2','Noor','Al Amiri','502223344',{card:{brand:'Mastercard',last4:'8832'}}),
    g('g3','Rami','Khoury','503334455',{card:{brand:'Visa',last4:'0921'},visits:6}),
    g('g4','Khalid','Mansour','504445566'),
    g('g5','Fatima','Zahra','505556677',{card:{brand:'Visa',last4:'5120'}}),
    g('g6','Hana','Saleh','506667788'),
    g('g7','Aisha','Rahman','507778899',{card:{brand:'Visa',last4:'7781'}}),
    g('g8','Zara','Nasser','508889900',{visits:0,lifetime:0,ref:'Google',notes:'Birthday today'}),
    g('g9','Leila','Tamer','509990011'),
    g('g10','Sophie','Laurent','501112233',{visits:1}),
    g('g11','Yusuf','Ahmed','502224466'),
    g('g12','Mona','Kassem','503336688',{card:{brand:'Amex',last4:'1006'}}),
    g('g13','Omar','Bakri','504448800'),
    g('g14','Nadia','Farouk','505550022',{card:{brand:'Visa',last4:'2290'},visits:2})
  ];
  const a = (id,guestId,prov,svc,len,start,status,extra) => Object.assign({id,guestId,prov,svc,len,start,day:0,status,addons:[],online:false,note:'',requested:false},extra||{});
  const appts = [
    a('a1','g3','layla','swe',80,600,'closed'),
    a('a2','g2','layla','hot',80,690,'checkedin',{addons:['oil']}),
    a('a3','g1','layla','swe',50,840,'confirmed'),
    a('a4','g4','omar','deep',50,630,'closed'),
    a('a5','g5','omar','aroma',80,720,'checkedin'),
    a('a6','g6','sara','classic',50,600,'closed'),
    a('a7','g7','sara','classic',50,660,'checkedin'),
    a('a8','g8','sara','classic',50,780,'booked',{note:'Birthday'}),
    a('a9','g9','dana','peel',50,750,'confirmed'),
    a('a10','g10','dana','hydra',50,840,'booked'),
    a('a11','g11','ali','deep',80,600,'closed'),
    a('a12','g12','ali','swe',50,720,'checkedin'),
    a('a13','g13','ali','hot',80,780,'confirmed')
  ];
  const s = {country:'AE',theme:'light',guests,appts,invoices:[],nextInv:10476,viewDay:0};
  appts.filter(x=>x.status==='closed').forEach(x=>{ makeInvoice(s,x,{tipPct:0.12,tender:x.guestId==='g3'?'Visa •••• 0921':'Cash'}); });
  s.invoices.push({id:10471,apptId:null,guestId:'g3',cur:'AED',serviceDate:'21 Nov',closeDate:'21 Nov',status:'closed',
    lines:[{name:'Swedish massage · 80 min',amt:380,saleBy:'Layla'}],sub:380,vat:19,tip:42,tipTo:'Layla',total:441,
    payments:[{tender:'Visa •••• 0921',amt:441}],log:[{t:'21 Nov 10:00',x:'Created from appointment · Layla'},{t:'21 Nov 11:24',x:'Closed by Lina A. · card payment'}]});
  return s;
}
let S, UI = {panel:null,na:null,pop:null,modal:null,menu:null,toast:null,search:'',ai:[],pay:{},flash:null,gb:null};
function load(){ try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ S = JSON.parse(raw); return; } }catch(e){} S = seed(); }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
function resetDemo(){ S = seed(); UI.panel=null;UI.modal=null;UI.ai=[];UI.pay={};UI.gb=null; save(); toast('Demo data reset'); render(); }

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C = () => COUNTRIES[S.country];
function loc(aed){ const c=C(); let v=aed*c.rate; return c.step>1? Math.round(v/c.step)*c.step : v; }
function money(v,cur){ return (cur||C().cur)+' '+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
const r2 = v => Math.round(v*100)/100;
const hm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function dayDate(d){ const x=new Date(DAY0); x.setDate(x.getDate()+d); return x; }
function dayLabel(d,long){ const x=dayDate(d); const wd=x.toLocaleDateString('en-GB',{weekday:long?'long':'short'}); const dm=x.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); return {wd,dm,num:x.getDate()}; }
const svc = id => SERVICES.find(s=>s.id===id);
const prov = id => PROVIDERS.find(p=>p.id===id);
const guest = id => S.guests.find(g=>g.id===id);
const appt = id => S.appts.find(a=>a.id===id);
const gname = g => g? g.first+' '+g.last : '';
const gshort = g => g? g.first+' '+g.last.charAt(0)+'.' : '';
function guestType(g,s,len){ if(g && g.member) return 'member'; if((!g || g.visits===0) && s.intro && len===50) return 'intro'; return 'nonmember'; }
function servicePrice(s,len,g){ const t=guestType(g,s,len); const base=s.p[len]; if(t==='member') return loc(Math.round(base*0.85)); if(t==='intro') return loc(s.intro); return loc(base); }
const typeLabel = t => ({member:'Member price',intro:'Intro price',nonmember:'Standard price'})[t];
function dispStatus(a){ if(a.status==='checkedin' && a.day===0 && a.start+a.len < DEMO_NOW) return 'attention'; return a.status; }
const statusName = s => ({booked:'Booked',confirmed:'Confirmed',checkedin:'Checked in',closed:'Closed',attention:'Payment due'})[s];
function digits(s){ return String(s||'').replace(/\D/g,'').replace(/^(971|63|966)/,'').replace(/^0+/,''); }
function findGuestByPhone(p){ const d=digits(p); if(d.length<7) return null; return S.guests.find(g=>digits(g.phone)===d)||null; }
function isFree(provId,day,start,len,ignoreId){
  if(start<OPEN || start+len>CLOSE) return false;
  if(day===0 && start<DEMO_NOW) return false;
  for(const [s,e] of (OFF[provId]||[])) if(start<e && start+len>s) return false;
  return !S.appts.some(a=>a.id!==ignoreId && a.prov===provId && a.day===day && a.status!=='cancelled' && start < a.start+a.len && start+len > a.start);
}
function apptLines(a){
  const s=svc(a.svc), g=guest(a.guestId);
  const lines=[{name:s.name+' · '+a.len+' min',amt:servicePrice(s,a.len,g),saleBy:prov(a.prov).name,kind:'service',sub:typeLabel(guestType(g,s,a.len))}];
  (a.addons||[]).forEach(id=>{const o=ADDONS.find(x=>x.id===id); lines.push({name:o.name,amt:loc(o.p),saleBy:prov(a.prov).name,kind:'addon',sub:'add-on'});});
  if(a.deal) lines.push({name:'Last-minute deal',amt:-loc(a.deal),saleBy:'',kind:'discount',sub:'offer'});
  return lines;
}
function makeInvoice(s,a,opt){
  const saveS=S; S=s;
  const lines=apptLines(a).concat(opt.extra||[]);
  const sub=r2(lines.reduce((t,l)=>t+l.amt,0)); const vat=r2(sub*C().vat);
  const tipBase=r2(lines.filter(l=>l.kind!=='product').reduce((t,l)=>t+l.amt,0));
  const tip= opt.tip!=null? opt.tip : r2(tipBase*(opt.tipPct||0));
  const inv={id:s.nextInv++,apptId:a.id,guestId:a.guestId,cur:C().cur,serviceDate:dayLabel(a.day).dm,closeDate:dayLabel(a.day).dm,status:'closed',
    lines,sub,vat,tip,tipTo:prov(a.prov).name,total:r2(sub+vat+tip),payments:[{tender:opt.tender,amt:r2(sub+vat+tip)}],
    log:[{t:dayLabel(a.day).dm+' '+hm(a.start),x:'Created from appointment · '+prov(a.prov).name},{t:dayLabel(a.day).dm+' '+hm(Math.min(a.start+a.len+5,DEMO_NOW)),x:'Closed by Lina A. · '+opt.tender}]};
  s.invoices.push(inv); a.invoiceId=inv.id; S=saveS; return inv;
}

  const guestsN=new Set(todays.map(a=>a.guestId)).size;
  const open=todays.filter(a=>dispStatus(a)==='attention').length;
  const value=todays.reduce((t,a)=>t+apptLines(a).reduce((x,l)=>x+l.amt,0),0);
  const capacity=PROVIDERS.length*(CLOSE-OPEN) - Object.values(OFF).flat().reduce((t,[s,e])=>t+(e-s),0);
  const pct=Math.round(todays.reduce((t,a)=>t+a.len,0)/capacity*100);

/* ---------- new appointment panel ---------- */
function openNew(o){
  UI.na=Object.assign({guestId:null,phone:'',first:'',last:'',svc:'swe',len:50,addons:[],prov:'layla',start:null,day:S.viewDay,requested:false,err:''},o||{});
  const na=UI.na;
  if(na.guestId){ const g=guest(na.guestId); na.phone='0'+g.phone; }
  const s=svc(na.svc); if(prov(na.prov).skill!==s.skill){ const alt=SERVICES.find(x=>x.skill===prov(na.prov).skill); na.svc=alt.id; na.len=+Object.keys(alt.p)[0]; }
  if(na.start==null) na.start=nextFree(na.prov,na.day,na.len);
  UI.panel='new'; UI.pop=null; renderLayer();
}
function nextFree(pid,day,len){ for(let m=(day===0?Math.ceil(DEMO_NOW/15)*15:OPEN);m+len<=CLOSE;m+=15){ if(isFree(pid,day,m,len)) return m; } return OPEN; }
function naTotals(){
  const na=UI.na, s=svc(na.svc), g=na.guestId?guest(na.guestId):null;
  const gt=guestType(g||{visits:0},s,na.len);
  const base=servicePrice(s,na.len,g||{visits:0,member:null});
  const add=na.addons.reduce((t,id)=>t+loc(ADDONS.find(a=>a.id===id).p),0);
  const sub=r2(base+add), vat=r2(sub*C().vat);
  return {gt,base,sub,vat,total:r2(sub+vat)};
}

/* ---------- pay ---------- */
function payState(id){ if(!UI.pay[id]) UI.pay[id]={tip:'15',custom:'',tender:null,cash:'',extra:[],receipt:'email'}; return UI.pay[id]; }
function payCalc(a,ps){
  const lines=apptLines(a).concat(ps.extra.map(e=>({name:e.name,amt:e.amt,saleBy:e.saleBy,kind:'product',sub:'retail'})));
  const sub=r2(lines.reduce((t,l)=>t+l.amt,0)), vat=r2(sub*C().vat);
  const tipBase=r2(lines.filter(l=>l.kind!=='product').reduce((t,l)=>t+l.amt,0));
  const cash=ps.tender==='cash';
  let tip=0; if(!cash){ if(ps.tip==='custom') tip=r2(parseFloat(ps.custom)||0); else tip=r2(tipBase*(+ps.tip/100)); }
  return {lines,sub,vat,tip,total:r2(sub+vat+tip)};
}

function doCharge(id){
  const a=appt(id), ps=payState(id), g=guest(a.guestId), c=payCalc(a,ps);

  const inv=makeInvoice(S,a,{tip:c.tip,tender,extra:c.lines.filter(l=>l.kind==='product')});
  inv.log[inv.log.length-1]={t:dayLabel(a.day).dm+' '+hm(DEMO_NOW),x:`Closed by Lina A. · ${tender}${ps.receipt!=='none'?' · receipt '+(ps.receipt==='email'?'emailed':'printed'):''}`};
  a.status='closed'; g.visits+=1; g.lifetime+=c.total;
  delete UI.pay[id]; UI.flash=id; save();

}

/* ---------- alalAI ---------- */
function aiAnswer(q){
  const t=q.toLowerCase();
  const tm=t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if(/free|available|who.*(at|for)/.test(t) && tm){
    let h=+tm[1], m=+(tm[2]||0); if(tm[3]==='pm'&&h<12) h+=12; if(!tm[3]&&h<9) h+=12;
    const start=h*60+m; const len=/80/.test(t)?80:50; const wantFacial=/facial|peel|skin/.test(t), wantMassage=/massage/.test(t);
    const ps=PROVIDERS.filter(p=>(!wantFacial||p.skill==='esthetics')&&(!wantMassage||p.skill==='massage')&&isFree(p.id,0,start,len));
    if(start<DEMO_NOW) return {html:`${hm(start)} has already passed today (it's ${hm(DEMO_NOW)}). Try a later time.`};
    if(!ps.length) return {html:`Nobody${wantFacial?' in esthetics':wantMassage?' in massage':''} is free at <b>${hm(start)}</b> for ${len} min. Try 15:30 or later.`};
    return {html:`<div><b>${ps.map(p=>p.name).join(', ')}</b> ${ps.length>1?'are':'is'} free at ${hm(start)} for ${len} min.</div><div class="small muted">${ps.map(p=>p.name+': '+p.room+(p.skill==='massage'?' · massage':' · esthetics')).join(' · ')}</div><div class="row wrap">${ps.slice(0,3).map((p,k)=>`<button class="btn sm ${k?'ghost':''}" data-act="aibook" data-p="${p.id}" data-t="${start}" data-l="${len}">Book with ${p.name}</button>`).join('')}</div>`};
  }
  if(/open|unpaid|due|invoice/.test(t)){
    const due=S.appts.filter(a=>dispStatus(a)==='attention');
    if(!due.length) return {html:'No payments are due right now. Every finished treatment has been paid.'};
    return {html:`<div>${due.length} finished treatment${due.length>1?'s haven\'t':' hasn\'t'} been paid. Until ${due.length>1?'they close':'it closes'}, the provider isn't paid for ${due.length>1?'them':'it'}.</div>${due.map(a=>`<button class="btn link" style="text-align:left;padding:2px 0" data-act="pay" data-id="${a.id}">Take payment: ${esc(gname(guest(a.guestId)))} · ${esc(svc(a.svc).short)} with ${prov(a.prov).name}</button>`).join('')}`};
  }
  if(/confirm/.test(t)){
    const b=S.appts.filter(a=>a.day===0&&a.status==='booked');
    if(!b.length) return {html:'Everyone booked today has confirmed.'};
    return {html:`<div>${b.length} guest${b.length>1?'s haven\'t':' hasn\'t'} confirmed today:</div>${b.map(a=>`<div class="small">• <b>${esc(gname(guest(a.guestId)))}</b> ${hm(a.start)} with ${prov(a.prov).name} <button class="btn link small" style="padding:0 4px" data-act="setst" data-v="confirmed" data-id="${a.id}">Mark confirmed</button></div>`).join('')}`};
  }
  if(/payment method|reopen|refund|backdate|wrong/.test(t)) return {html:'To change how a guest paid: open the invoice (Checkout › Invoices), choose <b>I want to… › Reopen invoice</b>, pick the new method and close it. The close date stays on the service date, so the provider is paid once. After 7 days, refund and re-sell instead.'};
  if(/member/.test(t)) return {html:`Memberships are sold on their own invoice, after the service is paid. Go to <a href="#/members">Memberships</a>. Nadia Farouk is a good candidate: 2 visits and a card on file.`};
  return {html:'In this prototype I can answer things like: <b>"Who\'s free at 3pm?"</b>, <b>"Show payments due"</b>, <b>"Who hasn\'t confirmed?"</b> or <b>"How do I change a payment method?"</b>'};
}

  <div class="panel-h"><div class="row" style="gap:12px"><span style="width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center">${ICON.bot}</span><div><b style="font-size:18px">alalAI</b><div class="small muted">Knows today's book, guests and invoices</div></div></div><button class="icon-btn" data-act="closepanel" aria-label="Close alalAI">${ICON.close}</button></div>

function gbConfirm(){
  const gb=gbState(); const g0=gbGuest();
  const savedOk = g0&&g0.card&&gb.useSaved!==false&&!gb.wallet&&!gb.card;
  const cd=gb.card.replace(/\D/g,'');
  if(!gb.wallet && !savedOk && cd.length<12){ gb.err='Add a card (any 12+ digits in this prototype), or use Apple Pay / Google Pay.'; render(); return; }
  let g=g0;
  if(!g){ g={id:'g'+Date.now(),first:gb.first.trim(),last:gb.last.trim(),phone:digits(gb.phone),email:gb.email,visits:0,member:null,card:null,sms:gb.sms,ref:gb.ref,lifetime:0,notes:'Booked online'}; S.guests.push(g); }
  if(!savedOk) g.card = gb.wallet?{brand:'Apple Pay',last4:'·'}:{brand:cd[0]==='4'?'Visa':cd[0]==='5'?'Mastercard':'Card',last4:cd.slice(-4)};

/* ---------- render ---------- */
function render(){
  document.documentElement.setAttribute('data-theme',S.theme);
  const {parts,q}=route(); const app=document.getElementById('app'); let html='';
  const r=parts[0]||'';
  if(r==='') html=viewChooser();
  else if(r==='book') html=viewBook();
  else if(r==='pay') html=viewPay(parts[1]);
  else if(r==='checkout') html=viewCheckout(q);
  else if(r==='invoice') html=viewInvoice(parts[1]);
  else if(r==='guests') html=viewGuests();
  else if(r==='guest') html=viewGuest(parts[1]);
  else if(r==='members') html=viewMembers(q);
  else if(r==='messages') html=viewMessages();
  else if(r==='more') html=viewMore();
  else if(r==='g') html=viewGB(parts[1]);
  else html=viewChooser();
  if(html) app.innerHTML=html;
  document.title = (r==='g'?'[SPA NAME] · Book':'henyoOS · Wellness & Spa')+' — Prototype';
  renderLayer();
  if(r==='book'){ const w=document.getElementById('bookwrap'); if(w && !render._scrolled){ w.scrollTop=Math.max(0,(DEMO_NOW-OPEN)/60*PXH-200); render._scrolled=true; }
    if(UI.flash){ const el=document.querySelector('.blk.flash'); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); const f=UI.flash; setTimeout(()=>{ if(UI.flash===f){UI.flash=null; const e=document.querySelector('.blk.flash'); if(e) e.classList.remove('flash');} },2500); } }
}
function renderLayer(){
  let h='';
  if(UI.panel==='new' && UI.na) h+=panelNew();
  if(UI.panel==='ai') h+=panelAI();
  if(UI.pop) h+=popAppt();
  if(UI.modal) h+=modalHtml();
  if(UI.toast) h+=`<div class="toast" role="status">${esc(UI.toast)}</div>`;
  const L=document.getElementById('layer'); const active=document.activeElement&&document.activeElement.id;
  L.innerHTML=h;
  if(active && L.querySelector('#'+active)) { const el=document.getElementById(active); el.focus(); if(el.setSelectionRange&&el.type!=='number'&&el.type!=='email') { try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){} } }
}

  addpoints(d){ const g=guest(d.id); g.points=(g.points||g.visits*100)+100; UI.menu=null; save(); toast(`100 points added to ${g.first}`); render(); },
  memplan(d){ UI.mem.plan=d.v; render(); },
  startmem(){ const m=UI.mem, g=guest(m.guestId), plan=PLANS.find(p=>p.id===m.plan); g.member=plan.id; g.nextDraft=dayLabel(30).dm; UI.memJust=false; save(); toast(`${g.first} is now a ${plan.name} member · first draft ${dayLabel(30).dm}${m.bonus?' · '+prov(m.bonus).name+' bonus added':''}`); go('#/guest/'+g.id); },
  ai(){ UI.panel='ai'; UI.pop=null; renderLayer(); const i=document.getElementById('aiinput'); if(i) i.focus(); },
  aiq(d){ askAI(d.q); },
  aibook(d){ openNew({prov:d.p,start:+d.t,len:+d.l,svc:(prov(d.p).skill==='massage'?'swe':'classic'),day:0}); },
  // guest booking
  gback(){ const st=route().parts[1]; const prev={service:'#/g',time:'#/g/service',details:'#/g/time',hold:'#/g/details'}[st]||'#/g'; gbState().err=''; go(prev); },
  gcat(d){ const gb=gbState(); if(gb.cat!==d.c){ gb.cat=d.c; const first=SERVICES.find(x=>x.cat===d.c); gb.svc=first.id; gb.len=+Object.keys(first.p)[0]; gb.addons=[]; gb.time=null; gb.prov='any'; } go('#/g/service'); },
  gsvc(d){ const gb=gbState(); gb.svc=d.s; const x=svc(d.s); if(!x.p[gb.len]) gb.len=+Object.keys(x.p)[0]; gb.addons=[]; gb.time=null; render(); },
  glen(d){ gbState().len=+d.l; gbState().time=null; render(); },
  gtotime(){ go('#/g/time'); },
  gprov(d){ const gb=gbState(); gb.prov=d.p; gb.time=null; gb.deal=false; render(); },
  gday(d){ const gb=gbState(); gb.day=+d.d; gb.time=null; gb.deal=false; render(); },
  gtime(d){ const gb=gbState(); gb.time=+d.m; gb.deal=d.deal==='1'; render(); },
  gtodetails(){ go('#/g/details'); },
  gtohold(){ const gb=gbState(); if(digits(gb.phone).length<7){ gb.err='Add your mobile number.'; render(); return; } if(!gbGuest() && !gb.first.trim()){ gb.err='Add your first name.'; render(); return; } gb.err=''; go('#/g/hold'); },
  gwallet(){ const gb=gbState(); gb.wallet=!gb.wallet; gb.useSaved=false; gb.err=''; render(); },
  gsaved(){ const gb=gbState(); gb.useSaved=true; gb.wallet=false; render(); },
  gconfirm(){ gbConfirm(); },
  seebooking(d,el,e){ e.preventDefault(); const a=appt(d.id); S.viewDay=a.day; UI.flash=a.id; render._scrolled=false; go('#/book'); }
};
function confirmReset(){ return true; }
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){ if(UI.menu && !e.target.closest('.menu')){ UI.menu=null; render(); } return; }
  const act=el.dataset.act; if(!A[act]) return;
  if(el.tagName==='A' && act!=='seebooking') return;
  if(UI.menu && act!=='menu' && !el.closest('.menu')) UI.menu=null;
  e.preventDefault(); A[act](el.dataset,el,e);
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in; if(!k) return; const v=e.target.value; const id=e.target.dataset.id;
  if(k==='search'){ UI.search=v; document.getElementById('searchres').innerHTML=searchResults(); }
  else if(k==='naphone'){ const na=UI.na; na.phone=v; na.err=''; const g=findGuestByPhone(v); if(g){ na.guestId=g.id; renderLayer(); } else { document.getElementById('na-guest').innerHTML=naGuestBox(); document.getElementById('na-total').innerHTML=naTotalHtml(); document.getElementById('na-type').textContent=typeLabel(naTotals().gt)+' applied automatically · '+hm(na.start)+' – '+hm(na.start+na.len); document.getElementById('na-price').textContent=money(naTotals().base);} }
  else if(k==='nafirst'){ UI.na.first=v; } else if(k==='nalast'){ UI.na.last=v; }
  else if(k==='customtip'){ payState(id).custom=v; const a=appt(id); document.getElementById('pay-total').textContent=money(payCalc(a,payState(id)).total); const b=document.querySelector('[data-act="charge"]'); if(b) b.textContent='Charge '+money(payCalc(a,payState(id)).total); }
  else if(k==='cash'){ payState(id).cash=v; const c=payCalc(appt(id),payState(id)); const g=parseFloat(v)||0, ch=r2(g-c.total); document.getElementById('change').innerHTML= g?(ch>=0?`<b>Change due: ${money(ch)}</b>`:`<span style="color:var(--danger)">Still due: ${money(-ch)}</span>`):''; }
  else if(k==='mpin'){ UI.modal.pin=v; } else if(k==='mreasontxt'){ UI.modal.reasonTxt=v; }
  else if(k==='gphone'){ const gb=gbState(); gb.phone=v; gb.err=''; document.getElementById('gb-who').innerHTML=gbWho(); document.getElementById('gb-foot').innerHTML=gbDetailsFoot(); }
  else if(k==='gfirst'){ gbState().first=v; } else if(k==='glast'){ gbState().last=v; } else if(k==='gemail'){ gbState().email=v; }
  else if(k==='gcard'){ const gb=gbState(); gb.card=v; gb.wallet=false; gb.useSaved=false; } else if(k==='gexp'){ gbState().exp=v; } else if(k==='gcvc'){ gbState().cvc=v; }
});
document.addEventListener('change',e=>{
  const k=e.target.dataset.ch; if(!k) return; const v=e.target.value, id=e.target.dataset.id;
  const na=UI.na;
  if(k==='nasvc'){ const s=svc(v); na.svc=v; if(!s.p[na.len]) na.len=+Object.keys(s.p)[0]; if(prov(na.prov).skill!==s.skill) na.prov=PROVIDERS.find(p=>p.skill===s.skill).id; na.addons=[]; na.err=''; renderLayer(); }
  else if(k==='naaddon'){ if(e.target.checked) na.addons.push(v); else na.addons=na.addons.filter(x=>x!==v); renderLayer(); }
  else if(k==='naprov'){ na.prov=v; na.err=''; renderLayer(); }
  else if(k==='natime'){ na.start=+v; na.err=''; renderLayer(); }
  else if(k==='nareq'){ na.requested=e.target.checked; renderLayer(); }
  else if(k==='saleby'){ payState(id).extra[+e.target.dataset.i].saleBy=v; }
  else if(k==='receipt'){ payState(id).receipt=v; }
  else if(k==='mreason'){ UI.modal.reason=v; }
  else if(k==='memguest'){ UI.mem.guestId=v; UI.memJust=false; render(); }
  else if(k==='memwaive'){ UI.mem.waive=e.target.checked; render(); }
  else if(k==='membonus'){ UI.mem.bonus=v; }
  else if(k==='gaddon'){ const gb=gbState(); if(e.target.checked) gb.addons.push(v); else gb.addons=gb.addons.filter(x=>x!==v); render(); }
  else if(k==='gref'){ gbState().ref=v; } else if(k==='gsms'){ gbState().sms=e.target.checked; }
});
document.addEventListener('submit',e=>{ if(e.target.dataset.form==='ai'){ e.preventDefault(); const i=document.getElementById('aiinput'); const q=i.value; i.value=''; askAI(q); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(UI.modal){UI.modal=null;} else if(UI.pop){UI.pop=null;} else if(UI.panel){UI.panel=null;} else if(UI.menu){UI.menu=null; render(); return;} renderLayer(); } });
window.addEventListener('hashchange',()=>{ UI.menu=null; UI.pop=null; if(route().parts[0]!=='book') render._scrolled=false; render(); window.scrollTo(0,0); });
load(); render();
</script>
</body>
</html>
